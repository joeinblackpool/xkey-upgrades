# Daily: review tested niches (Search Console) -> find early-stage niches -> rebuild site -> commit.
# Every push to main is deployed by Cloudflare Workers Builds. Pages are written by a scheduled
# Claude session following WRITING.md; this workflow only finds niches and rebuilds.
#
# Optional repo variable: GSC_SITE (e.g. sc-domain:xkey.co.uk) turns on the test-then-scale review.
# Optional secrets: BRAVE_API_KEY (search-results gap score), GSC_CREDENTIALS, INDEXNOW_KEY.
name: pipeline

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
      GSC_CREDENTIALS: ${{ secrets.GSC_CREDENTIALS }}
      INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }

      - name: Tests
        run: |
          python -m unittest tests.test_finder
          (cd builder && python -m unittest test_build)
          (cd feedback && python -m unittest test_review)
          (cd publish && python -m unittest test_indexnow)

      - name: Review tested niches
        if: ${{ vars.GSC_SITE != '' }}
        run: |
          pip install google-auth requests
          REV=""; [ -f feedback/revenue.csv ] && REV="--revenue feedback/revenue.csv"
          python feedback/review.py --niches state/niches.json --base-url "$(python -c 'import json;print(json.load(open("site.json"))["base_url"])')" \
            --gsc-site "${{ vars.GSC_SITE }}" $REV

      - name: Find early-stage niches
        run: python -m finder.run --state state --reports reports

      - name: Build site
        run: python builder/build.py

      - name: Commit (Cloudflare deploys on push)
        run: |
          git config user.name "pipeline-bot"
          git config user.email "pipeline-bot@users.noreply.github.com"
          git add -A state reports site
          git diff --cached --quiet && { echo "nothing changed"; exit 0; }
          git commit -m "pipeline: niches $(date -u +%F)"
          git pull --rebase
          git push

      - name: Ping IndexNow
        run: |
          LIVE=$(python -c 'import json;print(json.load(open("site.json")).get("live", False))')
          if [ "$LIVE" != "True" ] || [ -z "$INDEXNOW_KEY" ]; then echo "site hidden or no key; skipping"; exit 0; fi
          BASE=$(python -c 'import json;print(json.load(open("site.json"))["base_url"])')
          python publish/indexnow.py --site site --base-url "$BASE" --write-key-only
          git add site && git commit -m "pipeline: IndexNow key" && git push || true
          sleep 120
          python publish/indexnow.py --site site --base-url "$BASE" --state state/indexnow.json
          git add state/indexnow.json
          git diff --cached --quiet || { git commit -m "pipeline: IndexNow state"; git push; }
